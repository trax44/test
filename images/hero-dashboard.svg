<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect fill="#F4F5F6" width="800" height="500"/>

  <!-- Main dashboard container -->
  <rect fill="#fff" x="20" y="20" width="760" height="460" rx="12" stroke="#E0E0E0" stroke-width="2"/>

  <!-- Header bar -->
  <rect fill="#1D3C70" x="20" y="20" width="760" height="60" rx="12"/>
  <text fill="#fff" font-family="Inter, sans-serif" font-size="20" font-weight="700" x="40" y="55">
    RHOBS Dashboard - Indicateurs RH
  </text>

  <!-- Stats cards -->
  <g>
    <!-- Card 1 -->
    <rect fill="#fff" x="40" y="100" width="170" height="100" rx="8" stroke="#E0E0E0" stroke-width="1"/>
    <text fill="#1D3C70" font-family="Inter, sans-serif" font-size="12" font-weight="600" x="55" y="120">Effectifs</text>
    <text fill="#EC7D05" font-family="Inter, sans-serif" font-size="32" font-weight="800" x="55" y="160">1,247</text>
    <text fill="#4D7DD1" font-family="Inter, sans-serif" font-size="11" x="55" y="180">+3.2% ce mois</text>

    <!-- Card 2 -->
    <rect fill="#fff" x="230" y="100" width="170" height="100" rx="8" stroke="#E0E0E0" stroke-width="1"/>
    <text fill="#1D3C70" font-family="Inter, sans-serif" font-size="12" font-weight="600" x="245" y="120">Turnover</text>
    <text fill="#EC7D05" font-family="Inter, sans-serif" font-size="32" font-weight="800" x="245" y="160">8.4%</text>
    <text fill="#4D7DD1" font-family="Inter, sans-serif" font-size="11" x="245" y="180">-1.2% vs N-1</text>

    <!-- Card 3 -->
    <rect fill="#fff" x="420" y="100" width="170" height="100" rx="8" stroke="#E0E0E0" stroke-width="1"/>
    <text fill="#1D3C70" font-family="Inter, sans-serif" font-size="12" font-weight="600" x="435" y="120">Absentéisme</text>
    <text fill="#EC7D05" font-family="Inter, sans-serif" font-size="32" font-weight="800" x="435" y="160">4.2%</text>
    <text fill="#4D7DD1" font-family="Inter, sans-serif" font-size="11" x="435" y="180">Stable</text>

    <!-- Card 4 -->
    <rect fill="#fff" x="610" y="100" width="150" height="100" rx="8" stroke="#E0E0E0" stroke-width="1"/>
    <text fill="#1D3C70" font-family="Inter, sans-serif" font-size="12" font-weight="600" x="625" y="120">Index égalité</text>
    <text fill="#EC7D05" font-family="Inter, sans-serif" font-size="32" font-weight="800" x="625" y="160">87/100</text>
    <text fill="#4D7DD1" font-family="Inter, sans-serif" font-size="11" x="625" y="180">+2 pts</text>
  </g>

  <!-- Chart area -->
  <rect fill="#fff" x="40" y="220" width="520" height="240" rx="8" stroke="#E0E0E0" stroke-width="1"/>
  <text fill="#1D3C70" font-family="Inter, sans-serif" font-size="14" font-weight="600" x="55" y="245">
    Évolution mensuelle des effectifs
  </text>

  <!-- Chart bars -->
  <g opacity="0.9">
    <rect fill="#4D7DD1" x="70" y="350" width="35" height="80" rx="4"/>
    <rect fill="#4D7DD1" x="120" y="330" width="35" height="100" rx="4"/>
    <rect fill="#4D7DD1" x="170" y="310" width="35" height="120" rx="4"/>
    <rect fill="#4D7DD1" x="220" y="320" width="35" height="110" rx="4"/>
    <rect fill="#EC7D05" x="270" y="300" width="35" height="130" rx="4"/>
    <rect fill="#EC7D05" x="320" y="290" width="35" height="140" rx="4"/>
    <rect fill="#EC7D05" x="370" y="280" width="35" height="150" rx="4"/>
    <rect fill="#EC7D05" x="420" y="275" width="35" height="155" rx="4"/>
    <rect fill="#EC7D05" x="470" y="270" width="35" height="160" rx="4"/>
  </g>

  <!-- Chart labels -->
  <text fill="#474747" font-family="Inter, sans-serif" font-size="10" x="75" y="450">Jan</text>
  <text fill="#474747" font-family="Inter, sans-serif" font-size="10" x="175" y="450">Mar</text>
  <text fill="#474747" font-family="Inter, sans-serif" font-size="10" x="275" y="450">Mai</text>
  <text fill="#474747" font-family="Inter, sans-serif" font-size="10" x="375" y="450">Juil</text>
  <text fill="#474747" font-family="Inter, sans-serif" font-size="10" x="470" y="450">Sep</text>

  <!-- Filters panel -->
  <rect fill="#fff" x="580" y="220" width="180" height="240" rx="8" stroke="#E0E0E0" stroke-width="1"/>
  <text fill="#1D3C70" font-family="Inter, sans-serif" font-size="13" font-weight="600" x="595" y="245">
    Filtres actifs
  </text>

  <!-- Filter items -->
  <rect fill="#F4F5F6" x="595" y="260" width="155" height="28" rx="6"/>
  <text fill="#1D3C70" font-family="Inter, sans-serif" font-size="11" x="605" y="278">Tous établissements</text>

  <rect fill="#F4F5F6" x="595" y="300" width="155" height="28" rx="6"/>
  <text fill="#1D3C70" font-family="Inter, sans-serif" font-size="11" x="605" y="318">CDI + CDD</text>

  <rect fill="#F4F5F6" x="595" y="340" width="155" height="28" rx="6"/>
  <text fill="#1D3C70" font-family="Inter, sans-serif" font-size="11" x="605" y="358">Année 2024</text>

  <!-- Export button -->
  <rect fill="#EC7D05" x="595" y="415" width="155" height="35" rx="6"/>
  <text fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="600" x="635" y="438">
    Exporter
  </text>
</svg>
